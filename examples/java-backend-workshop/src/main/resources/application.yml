server:
  address: 127.0.0.1
  port: 8081
spring:
  datasource:
    url: jdbc:h2:mem:backend_workshop;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jackson:
    deserialization:
      fail-on-unknown-properties: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
